name: Sync TMDB catalog

on:
  workflow_dispatch:
    inputs:
      language:
        description: TMDB language (for example id-ID or en-US)
        required: true
        default: id-ID
        type: string
      import_limit:
        description: Maximum titles per category (1–100)
        required: true
        default: "20"
        type: string

permissions:
  contents: write

concurrency:
  group: tmdb-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch and write TMDB catalog
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          TMDB_LANGUAGE: ${{ inputs.language }}
          TMDB_IMPORT_LIMIT: ${{ inputs.import_limit }}
        run: node scripts/sync-tmdb.mjs

      - name: Commit catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/movies.json data/series.json data/genres.json data/cast.json
          if git diff --cached --quiet; then
            echo "TMDB sync succeeded; catalog files already match the latest data. No commit needed."
          else
            git commit -m "Sync catalog data from TMDB"
            git push origin HEAD:main
          fi
